name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The `f64` and `gpu` features are mutually exclusive (WGSL shaders
        # are f32-only, see `compile_error!` in src/lib.rs), so we exercise
        # them in separate jobs instead of via `--all-features`.
        features:
          - "gpu,gpu-blocking,wasm"
          - "f64,wasm"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install rustfmt and clippy
        run: rustup component add rustfmt clippy
      - name: Rustfmt
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --features "${{ matrix.features }}" -- -D warnings
      - name: Tests
        run: cargo test --features "${{ matrix.features }}"

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - name: Build wasm target
        run: cargo build --target wasm32-unknown-unknown --features wasm

  verify-typescript-wasm-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Add WASM target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            npm/kriging-rs-wasm/package-lock.json
            examples/web-2d/package-lock.json
            www/package-lock.json
      # jetli/wasm-pack-action fails on current runners (EXDEV renaming /tmp -> ~/.cargo/bin).
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: Verify TypeScript WASM package
        working-directory: npm/kriging-rs-wasm
        run: npm ci && npm run verify
      # The web apps consume the package built above via file: links, so API drift
      # breaks the build here instead of silently rotting.
      - name: Build and check the 2-D web starter
        working-directory: examples/web-2d
        run: npm ci && npm run build && npm run check
      - name: Build the www demo
        working-directory: www
        run: npm ci && npm run build
      - name: Dry-run npm publish
        working-directory: npm/kriging-rs-wasm
        run: npm publish --dry-run
      - name: Verify packed tarball includes pkg/
        working-directory: npm/kriging-rs-wasm
        run: |
          npm pack
          TGZ=$(ls kriging-rs-wasm-*.tgz)
          tar -tzf "$TGZ" | grep -q 'package/pkg/kriging_rs.js' || (echo "::error::Tarball missing package/pkg/kriging_rs.js" && exit 1)
          tar -tzf "$TGZ" | grep -q 'package/pkg/kriging_rs_bg.wasm' || (echo "::error::Tarball missing package/pkg/kriging_rs_bg.wasm" && exit 1)
          echo "Tarball contains pkg/ as required."
